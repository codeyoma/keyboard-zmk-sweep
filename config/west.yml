manifest:
  remotes:
    - name: codeyoma
      url-base: https://github.com/codeyoma
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    # Pinned to the latest ZMK release. ZMK main moved to Zephyr 4.1 (board names such as
    # nice_nano//zmk), which breaks this config. Change v0.3 to v0.4 here and in
    # .github/workflows/build.yml together once ZMK v0.4 is released.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml

    # KeyLay: the active layer and batteries for the KeyLay app, and the &keylay key
    - name: keylay
      remote: codeyoma
      revision: main

  self:
    path: config
